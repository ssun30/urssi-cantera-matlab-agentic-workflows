title: Reliable Agentic Workflows for Sustainable Multi-Language Scientific Software Interfaces
description: >-
  A URSSI Fellowship project investigating whether agentic AI workflows can
  reliably maintain and sustain cross-language interfaces for scientific
  software, using the Cantera MATLAB interface as a case study.

# --- GitHub Pages / Jekyll ---
theme: minima
url: "https://ssun30.github.io"
baseurl: "/urssi-cantera-matlab-agentic-workflows"

author: Su Sun
email: sun.su@northeastern.edu

minima:
  social_links:
    github: ssun30

# Show these pages in the site header nav
header_pages:
  - blog.md
  - timeline.md
  - about.md

# Blog posts live in _posts/ and are listed automatically on the home page
show_excerpts: true

# Render posts dated in the future (the Introduction post is dated Aug 1, 2026).
# Without this, Jekyll silently skips any post whose date is after "today".
future: true

plugins:
  - jekyll-feed
  - jekyll-seo-tag

# Files that should not be copied into the built site
exclude:
  - README.md
  - Gemfile
  - Gemfile.lock
  - vendor
  - .gitignore
